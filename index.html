<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="a free language learning app focused on speaking and listening."
  />

  <meta name="theme-color" content="#171717" />

  <title>language / learn</title>

  <!--
    TYPEWRITER FONT
    ----------------------------------------------------
    This is intentionally kept as the main visual identity.
    IBM Plex Mono gives the app the typewriter/editorial look.
  -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <style>
    /* ==================================================
       RESET
       ================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #171717;
    }

    body {
      min-height: 100vh;
      background: #171717;
      color: #e8e5df;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: #e8e5df;
      color: #171717;
    }

    /* ==================================================
       VARIABLES
       ================================================== */

    :root {
      --bg: #171717;
      --panel: #1d1d1d;
      --panel-2: #202020;
      --border: #3a3a3a;
      --border-soft: #2d2d2d;
      --text: #e8e5df;
      --muted: #929292;
      --dim: #656565;
      --success: #b8c7b2;
      --danger: #c99b9b;
      --max: 1120px;
    }

    /* ==================================================
       GLOBAL
       ================================================== */

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .tiny {
      font-size: 10px;
      color: var(--dim);
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
    }

    .container {
      width: min(100% - 40px, var(--max));
      margin: 0 auto;
    }

    .page {
      min-height: 100vh;
    }

    /* ==================================================
       AUTH
       ================================================== */

    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .auth-wrap {
      width: min(100%, 460px);
    }

    .brand {
      margin-bottom: 48px;
    }

    .brand-name {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: lowercase;
    }

    .brand-line {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-top: 15px;
    }

    .auth-heading {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .auth-description {
      color: var(--muted);
      max-width: 390px;
      margin-bottom: 35px;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 25px;
    }

    .auth-tab {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 10px 0;
      margin-right: 28px;
      position: relative;
    }

    .auth-tab.active {
      color: var(--text);
    }

    .auth-tab.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--text);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 7px;
      text-transform: lowercase;
    }

    .field input {
      width: 100%;
      background: #191919;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 13px 14px;
      outline: none;
      border-radius: 0;
    }

    .field input:focus {
      border-color: #707070;
    }

    .primary-button {
      width: 100%;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--bg);
      padding: 13px 16px;
      transition: 0.15s ease;
    }

    .primary-button:hover {
      background: transparent;
      color: var(--text);
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 11px 16px;
      transition: 0.15s ease;
    }

    .secondary-button:hover {
      border-color: #777;
    }

    .auth-message {
      margin-top: 18px;
      min-height: 24px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ==================================================
       APP SHELL
       ================================================== */

    #app-screen {
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(23, 23, 23, 0.96);
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      width: min(100% - 40px, var(--max));
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .topbar-logo {
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .xp-display {
      color: var(--muted);
      font-size: 11px;
    }

    .logout-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 5px;
    }

    .logout-button:hover {
      color: var(--text);
    }

    .app-layout {
      min-height: calc(100vh - 70px);
      display: grid;
      grid-template-columns: 190px 1fr;
    }

    .sidebar {
      border-right: 1px solid var(--border-soft);
      padding: 30px 20px;
    }

    .sidebar-label {
      color: var(--dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }

    .nav-button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 0;
    }

    .nav-button:hover,
    .nav-button.active {
      color: var(--text);
    }

    .main {
      min-width: 0;
    }

    .content {
      width: min(100% - 50px, 900px);
      margin: 0 auto;
      padding: 55px 0 100px;
    }

    /* ==================================================
       PAGE HEADERS
       ================================================== */

    .page-kicker {
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .page-title {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .page-description {
      max-width: 650px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* ==================================================
       HOME
       ================================================== */

    .home-hero {
      border-bottom: 1px solid var(--border);
      padding-bottom: 45px;
      margin-bottom: 40px;
    }

    .home-title {
      font-size: clamp(38px, 8vw, 76px);
      font-weight: 300;
      line-height: 0.98;
      letter-spacing: -0.04em;
      max-width: 780px;
    }

    .home-title span {
      color: var(--muted);
    }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .home-card {
      min-height: 190px;
      background: var(--panel);
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .home-card-title {
      font-size: 18px;
    }

    .home-card-text {
      color: var(--muted);
      font-size: 12px;
      max-width: 360px;
    }

    .text-link {
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 0;
      margin-top: 20px;
    }

    .text-link::after {
      content: " →";
      color: var(--muted);
    }

    /* ==================================================
       LANGUAGE CARDS
       ================================================== */

    .language-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .language-card {
      min-height: 180px;
      background: var(--panel);
      border: 0;
      color: var(--text);
      text-align: left;
      padding: 25px;
      position: relative;
      transition: background 0.15s ease;
    }

    .language-card:hover {
      background: var(--panel-2);
    }

    .language-index {
      color: var(--dim);
      font-size: 10px;
      margin-bottom: 50px;
    }

    .language-name {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .language-native {
      color: var(--muted);
      font-size: 12px;
    }

    /* ==================================================
       BREADCRUMB
       ================================================== */

    .breadcrumb {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 28px;
    }

    .breadcrumb button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 0;
    }

    .breadcrumb button:hover {
      color: var(--text);
    }

    .breadcrumb-separator {
      color: var(--dim);
    }

    /* ==================================================
       TOPICS
       ================================================== */

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .topic-card {
      background: var(--panel);
      color: var(--text);
      border: 0;
      text-align: left;
      padding: 24px;
      min-height: 180px;
      transition: background 0.15s ease;
    }

    .topic-card:hover {
      background: var(--panel-2);
    }

    .topic-number {
      color: var(--dim);
      font-size: 10px;
      margin-bottom: 42px;
    }

    .topic-name {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .topic-description {
      color: var(--muted);
      font-size: 11px;
    }

    .topic-count {
      color: var(--dim);
      font-size: 10px;
      margin-top: 20px;
    }

    /* ==================================================
       LESSON OPTIONS
       ================================================== */

    .lesson-list {
      border-top: 1px solid var(--border);
    }

    .lesson-option {
      width: 100%;
      display: grid;
      grid-template-columns: 55px 1fr auto;
      align-items: center;
      gap: 20px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 23px 0;
    }

    .lesson-option:hover {
      background: rgba(255,255,255,0.025);
    }

    .lesson-number {
      color: var(--dim);
      font-size: 11px;
    }

    .lesson-name {
      font-size: 15px;
      margin-bottom: 3px;
    }

    .lesson-description {
      color: var(--muted);
      font-size: 11px;
    }

    .lesson-arrow {
      color: var(--muted);
    }

    /* ==================================================
       LESSON
       ================================================== */

    .lesson-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 45px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
    }

    .lesson-header-title {
      font-size: 22px;
      font-weight: 400;
    }

    .lesson-counter {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .progress-line {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 45px;
      position: relative;
    }

    .progress-line-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 1px;
      background: var(--text);
      width: 0%;
      transition: width 0.25s ease;
    }

    .question-type {
      color: var(--dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 20px;
    }

    .question-target {
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.2;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .question-pronunciation {
      color: var(--muted);
      margin-bottom: 35px;
    }

    .question-instruction {
      color: var(--muted);
      margin-bottom: 25px;
      max-width: 620px;
    }

    /* ==================================================
       CHOICES
       ================================================== */

    .choice-grid {
      display: grid;
      gap: 8px;
      margin-top: 25px;
    }

    .choice-button {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 15px;
      transition: 0.15s ease;
    }

    .choice-button:hover:not(:disabled) {
      border-color: #707070;
      background: var(--panel);
    }

    .choice-button.correct {
      border-color: var(--success);
      color: var(--success);
    }

    .choice-button.wrong {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ==================================================
       SPEAK / LISTEN BUTTONS
       ================================================== */

    .speak-button {
      min-width: 210px;
      border: 1px solid var(--text);
      background: transparent;
      color: var(--text);
      padding: 15px 20px;
      transition: 0.15s ease;
    }

    .speak-button:hover:not(:disabled) {
      background: var(--text);
      color: var(--bg);
    }

    .speak-button.recording {
      border-color: var(--danger);
      color: var(--danger);
    }

    .target-box {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 24px;
      margin-bottom: 25px;
    }

    .target-label {
      color: var(--dim);
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .target-text {
      font-size: 23px;
      line-height: 1.5;
    }

    .transcript-box {
      min-height: 75px;
      border-left: 1px solid var(--border);
      padding-left: 18px;
      margin: 28px 0;
    }

    .transcript-label {
      color: var(--dim);
      font-size: 10px;
      margin-bottom: 6px;
    }

    .transcript-text {
      color: var(--text);
      word-break: break-word;
    }

    .score-display {
      border-top: 1px solid var(--border);
      margin-top: 30px;
      padding-top: 25px;
    }

    .score-number {
      font-size: 48px;
      font-weight: 300;
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
    }

    /* ==================================================
       FEEDBACK
       ================================================== */

    .feedback {
      margin-top: 25px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
    }

    .feedback strong {
      color: var(--text);
      font-weight: 400;
    }

    .feedback-success {
      color: var(--success);
    }

    .feedback-danger {
      color: var(--danger);
    }

    .next-row {
      margin-top: 35px;
      display: flex;
      justify-content: flex-end;
    }

    .next-button {
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--bg);
      padding: 12px 20px;
    }

    /* ==================================================
       RESULTS
       ================================================== */

    .result-box {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 35px 0;
      margin-bottom: 35px;
    }

    .result-score {
      font-size: clamp(55px, 12vw, 100px);
      font-weight: 300;
      line-height: 1;
    }

    .result-label {
      color: var(--muted);
      margin-top: 8px;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border);
      background: var(--border);
      gap: 1px;
    }

    .result-stat {
      background: var(--panel);
      padding: 22px;
    }

    .result-stat-number {
      font-size: 28px;
    }

    .result-stat-label {
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
    }

    /* ==================================================
       PROGRESS
       ================================================== */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 45px;
    }

    .stat-card {
      background: var(--panel);
      padding: 23px;
    }

    .stat-number {
      font-size: 30px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
    }

    .progress-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 15px;
      margin-bottom: 18px;
      font-weight: 400;
    }

    .topic-progress-row {
      display: grid;
      grid-template-columns: 190px 1fr 50px;
      gap: 15px;
      align-items: center;
      border-top: 1px solid var(--border-soft);
      padding: 14px 0;
    }

    .topic-progress-bar {
      height: 1px;
      background: var(--border);
      position: relative;
    }

    .topic-progress-fill {
      position: absolute;
      height: 1px;
      background: var(--text);
      left: 0;
      top: 0;
    }

    /* ==================================================
       PROFILE
       ================================================== */

    .profile-block {
      border-top: 1px solid var(--border);
      padding: 25px 0;
    }

    .profile-label {
      color: var(--dim);
      font-size: 10px;
      margin-bottom: 8px;
    }

    .profile-value {
      font-size: 15px;
      word-break: break-word;
    }

    /* ==================================================
       TOAST
       ================================================== */

    #toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      max-width: 350px;
      background: var(--text);
      color: var(--bg);
      padding: 12px 15px;
      font-size: 11px;
      z-index: 100;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ==================================================
       RESPONSIVE
       ================================================== */

    @media (max-width: 800px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border-soft);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        overflow-x: auto;
      }

      .sidebar-label {
        display: none;
      }

      .nav-button {
        width: auto;
        white-space: nowrap;
        padding: 7px 0;
      }

      .content {
        width: min(100% - 30px, 900px);
        padding-top: 35px;
      }

      .language-grid,
      .topic-grid,
      .home-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .result-stats {
        grid-template-columns: 1fr;
      }

      .topic-progress-row {
        grid-template-columns: 120px 1fr 35px;
      }
    }

    @media (max-width: 520px) {
      .topbar-inner {
        width: min(100% - 25px, var(--max));
      }

      .xp-display {
        display: none;
      }

      .content {
        width: min(100% - 25px, 900px);
      }

      .lesson-option {
        grid-template-columns: 35px 1fr auto;
        gap: 10px;
      }

      .question-target {
        font-size: 30px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .topic-progress-row {
        grid-template-columns: 1fr 45px;
      }

      .topic-progress-bar {
        grid-column: 1 / -1;
        grid-row: 2;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       AUTH SCREEN
       ================================================== -->

  <section id="auth-screen">

    <div class="auth-wrap">

      <div class="brand">
        <div class="brand-name">
          language / learn
        </div>

        <div class="brand-line"></div>
      </div>

      <h1 class="auth-heading">
        learn by speaking.
      </h1>

      <p class="auth-description">
        a free language-learning space built around
        listening, speaking, and real conversation.
      </p>

      <div class="auth-tabs">

        <button
          id="login-tab"
          class="auth-tab active"
          type="button"
        >
          login
        </button>

        <button
          id="signup-tab"
          class="auth-tab"
          type="button"
        >
          create account
        </button>

      </div>

      <form id="auth-form">

        <div class="field">

          <label for="email">
            email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          />

        </div>

        <div class="field">

          <label for="password">
            password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />

        </div>

        <button
          id="auth-submit"
          class="primary-button"
          type="submit"
        >
          login
        </button>

      </form>

      <div

    /* ==================================================

    function $(id) {
      return document.getElementById(id);
    }


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function shuffle(array) {

      const copy = [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }

      return copy;

    }


    function showToast(message) {

      const toast = $("toast");

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2800);

    }


    function getRedirectUrl() {

      const path =
        window.location.pathname.endsWith("/")
          ? window.location.pathname
          : window.location.pathname + "/";

      if (
        window.location.protocol === "http:" ||
        window.location.protocol === "https:"
      ) {

        return (
          window.location.origin +
          path
        );

      }

      return (
        "https://selinahe361-eng.github.io/language-app/"
      );

    }


    /* ==================================================
       AUTH UI
       ================================================== */

    function setAuthMode(mode) {

      authMode = mode;

      const login =
        mode === "login";

      $("login-tab")
        .classList.toggle(
          "active",
          login
        );

      $("signup-tab")
        .classList.toggle(
          "active",
          !login
        );

      $("auth-submit").textContent =
        login
          ? "login"
          : "create account";

      $("password").autocomplete =
        login
          ? "current-password"
          : "new-password";

      $("auth-message").textContent = "";

    }


    $("login-tab").addEventListener(
      "click",
      () => setAuthMode("login")
    );


    $("signup-tab").addEventListener(
      "click",
      () => setAuthMode("signup")
    );


    $("auth-form").addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const email =
          $("email").value.trim();

        const password =
          $("password").value;

        const message =
          $("auth-message");

        message.textContent =
          "working...";

        try {

          if (authMode === "login") {

            const {
              error
            } =
              await supabaseClient.auth
                .signInWithPassword({
                  email,
                  password
                });

            if (error) {
              throw error;
            }

            message.textContent =
              "logged in.";

          } else {

            const {
              data,
              error
            } =
              await supabaseClient.auth
                .signUp({

                  email,
                  password,

                  options: {
                    emailRedirectTo:
                      getRedirectUrl()
                  }

                });

            if (error) {
              throw error;
            }

            if (
              data.user &&
              !data.session
            ) {

              message.textContent =
                "check your email to confirm your account.";

            } else {

              message.textContent =
                "account created.";

            }

          }

        } catch (error) {

          console.error(error);

          message.textContent =
            error.message ||
            "something went wrong.";

        }

      }
    );


    /* ==================================================
       AUTH SESSION
       ================================================== */

    async function initializeAuth() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();

        if (error) {
          throw error;
        }

        if (data.session) {

          await setupUser(
            data.session.user
          );

        } else {

          showAuth();

        }

      } catch (error) {

        console.error(error);

        showAuth();

      }

    }


    supabaseClient.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (
          event === "SIGNED_IN" &&
          session
        ) {

          await setupUser(
            session.user
          );

        }

        if (
          event === "SIGNED_OUT"
        ) {

          showAuth();

        }

      }
    );


    async function setupUser(user) {

      currentUser = user;

      $("auth-screen")
        .classList.add("hidden");

      $("app-screen")
        .classList.remove("hidden");

      await loadProgress();

      goHome();

    }


    function showAuth() {

      $("auth-screen")
        .classList.remove("hidden");

      $("app-screen")
        .classList.add("hidden");

    }


    async function logout() {

      await stopSpeechRecognition();

      await supabaseClient.auth
        .signOut();

    }


    /* ==================================================
       PROGRESS DATABASE
       ================================================== */

    async function loadProgress() {

      if (!currentUser) {
        return;
      }

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("user_progress")
            .select("*")
            .eq(
              "user_id",
              currentUser.id
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            )
            .limit(1)
            .maybeSingle();

        if (error) {
          throw error;
        }

        if (data) {

          progress = data;

        } else {

          const {
            data: created,
            error: createError
          } =
            await supabaseClient
              .from("user_progress")
              .insert({

                user_id:
                  currentUser.id,

                language:
                  "none",

                xp: 0,

                streak: 0,

                lessons_completed: 0,

                words_learned: 0

              })
              .select()
              .single();

          if (createError) {
            throw createError;
          }

          progress = created;

        }

        updateTopbar();

      } catch (error) {

        console.error(
          "progress load error",
          error
        );

        progress = {

          xp: 0,
          streak: 0,
          lessons_completed: 0,
          words_learned: 0

        };

      }

    }


    async function saveProgress() {

      if (
        !currentUser ||
        !progress
      ) {

        return;

      }

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("user_progress")
            .update({

              language:
                progress.language || "none",

              xp:
                progress.xp || 0,

              streak:
                progress.streak || 0,

              lessons_completed:
                progress.lessons_completed || 0,

              words_learned:
                progress.words_learned || 0,

              updated_at:
                new Date().toISOString()

            })
            .eq(
              "user_id",
              currentUser.id
            )
            .select()
            .limit(1);

        if (error) {
          throw error;
        }

        updateTopbar();

      } catch (error) {

        console.error(
          "progress save error",
          error
        );

      }

    }

    function createTopicLesson(
      lessonType
    ) {

      const topic =
        languageData[
          currentLanguage
        ].topics[
          currentTopic
        ];

      let items =
        shuffle(topic.items);

      /*
        We use the same topic data but change
        how the learner interacts with it.
      */

      if (
        lessonType === "foundation"
      ) {

        return items
          .slice(0, 8)
          .map(item => ({
            ...item,
            mode: "learn"
          }));

      }


      if (
        lessonType === "speaking"
      ) {

        return items
          .slice(0, 8)
          .map(item => ({
            ...item,
            mode: "speak"
          }));

      }


      if (
        lessonType === "listening"
      ) {

        return items
          .slice(0, 8)
          .map(item => ({
            ...item,
            mode: "listen"
          }));

      }


      if (
        lessonType === "conversation"
      ) {

        return items
          .slice(0, 8)
          .map(item => ({
            ...item,
            mode: "conversation"
          }));

      }


      return [];

    }

      lessonType

      stopSpeechRecognition();

    function makeOptions(correct) {

      const topic =
        languageData[
          currentLanguage
        ].topics[
          currentTopic
        ];

      const wrong =
        shuffle(
          topic.items.filter(
            item =>
              item.word !==
              correct.word
          )
        ).slice(0, 3);

      return shuffle([
        correct,
        ...wrong
      ]);

    }

    async function practiceSpeaking() {

      if (
        questionAnswered
      ) {

        return;

      }

      if (
        speechRecognition
      ) {

        return;

      }

      const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!Recognition) {

        $("speech-status")
          .innerHTML =
            `<span class="feedback-danger">
              speech recognition is not available
              in this browser. try Chrome or Edge
              on desktop.
            </span>`;

        return;

      }

      speechFinished = false;

      const button =
        $("record-button");

      const status =
        $("speech-status");

      const transcript =
        $("speech-transcript");

      button.disabled =
        true;

      button.classList.add(
        "recording"
      );

      button.textContent =
        "● listening...";

      status.textContent =
        "speak now.";

      transcript.textContent =
        "listening...";

      speechRecognition =
        new Recognition();

      speechRecognition.lang =
        languageData[
          currentLanguage
        ].code;

      speechRecognition.continuous =
        false;

      speechRecognition.interimResults =
        false;

      speechRecognition.maxAlternatives =
        5;


      speechRecognition.onresult =
        event => {

          if (
            speechFinished
          ) {

            return;

          }

          const results =
            event.results;

          if (
            !results ||
            !results.length
          ) {

            return;

          }

          const result =
            results[
              results.length - 1
            ];

          const alternatives =
            [];

          for (
            let i = 0;
            i < result.length;
            i++
          ) {

            if (
              result[i] &&
              result[i].transcript
            ) {

              alternatives.push(
                result[i].transcript
              );

            }

          }

          if (
            !alternatives.length
          ) {

            return;

          }

          const target =
            currentQuestion.word;

          let best =
            {
              transcript:
                alternatives[0],
              score:
                scoreSpeech(
                  alternatives[0],
                  target
                )
            };

          alternatives
            .slice(1)
            .forEach(
              candidate => {

                const score =
                  scoreSpeech(
                    candidate,
                    target
                  );

                if (
                  score >
                  best.score
                ) {

                  best = {
                    transcript:
                      candidate,
                    score
                  };

                }

              }
            );

          transcript.textContent =
            best.transcript;

          finishSpeechAttempt(
            best.score
          );

        };


      speechRecognition.onerror =
        event => {

          if (
            speechFinished
          ) {

            return;

          }

          speechFinished = true;

          console.warn(
            "speech recognition error:",
            event.error
          );

          let message =
            "something went wrong.";

          if (
            event.error ===
            "not-allowed"
          ) {

            message =
              "microphone access was denied. allow microphone access and try again.";

          }

          else if (
            event.error ===
            "no-speech"
          ) {

            message =
              "i didn't hear anything. try speaking closer to your microphone.";

          }

          else if (
            event.error ===
            "audio-capture"
          ) {

            message =
              "your microphone could not be accessed.";

          }

          else if (
            event.error ===
            "network"
          ) {

            message =
              "the browser speech service had a network problem. try again.";

          }

          status.textContent =
            message;

          resetRecordButton();

        };


      speechRecognition.onend =
        () => {

          speechRecognition =
            null;

          if (
            !speechFinished
          ) {

            resetRecordButton();

            if (
              !questionAnswered
            ) {

              status.textContent =
                "no complete speech result was detected. try again.";

            }

          }

        };


      try {

        speechRecognition.start();

      } catch (error) {

        console.error(error);

        speechRecognition =
          null;

        speechFinished =
          true;

        resetRecordButton();

        status.textContent =
          "could not start the microphone. try again.";

      }

    }


    function finishSpeechAttempt(
      score
    ) {

      if (
        speechFinished
      ) {

        return;

      }

      speechFinished = true;

      const finalScore =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(score)
          )
        );

      speechScores.push(
        finalScore
      );

      const scoreArea =
        $("speech-score");

      const status =
        $("speech-status");

      if (

        questionAnswered =
          true;

        lessonCorrect++;

        scoreArea.innerHTML = `

          <div class="score-display">

            <div class="score-number">

            </div>

            <div class="score-label">

            </div>

          </div>

        `;

        status.innerHTML =
          `<span class="feedback-success">
            ✓ good match. your speech was
            recognized successfully.
          </span>`;

        showNextButton();

      } else {

        scoreArea.innerHTML = `

            <div class="score-number">
              ${finalScore}%
            </div>

            <div class="score-label">

            </div>

        `;

        status.innerHTML =
          `<span class="feedback-danger">
            not quite. try saying the phrase
            again.
          </span>`;

      }

      resetRecordButton();

    }

    /* ==================================================
       SPEECH SCORING
       ================================================== */

    function normalizeSpeech(
      text
    ) {

      return String(text)

        .toLowerCase()

        .normalize(
          "NFD"
        )

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .replace(
          /[^\p{L}\p{N}\s]/gu,
          " "
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim();

    }


    function scoreSpeech(
      heard,
      target
    ) {

      const a =
        normalizeSpeech(heard);

      const b =
        normalizeSpeech(target);

      if (!a || !b) {
        return 0;
      }

      if (a === b) {
        return 100;
      }

      const distance =
        levenshtein(
          a,
          b
        );

      const maxLength =
        Math.max(
          a.length,
          b.length
        );

      const characterScore =
        maxLength === 0
          ? 0
          : (
              1 -
              distance /
              maxLength
            ) * 100;

      const heardWords =
        a.split(" ");

      const targetWords =
        b.split(" ");

      let matchingWords =
        0;

      targetWords.forEach(
        word => {

          if (
            heardWords.includes(
              word
            )
          ) {

            matchingWords++;

          }

        }
      );

      const wordScore =
        targetWords.length === 0
          ? 0
          : (
              matchingWords /
              targetWords.length
            ) * 100;

      /*
        Character similarity is useful for short words.
        Word overlap helps with longer phrases.
      */

      return (
        characterScore * 0.65 +
        wordScore * 0.35
      );

    }


    function levenshtein(
      a,
      b
    ) {

      const matrix =
        Array.from(
          {
            length:
              b.length + 1
          },
          () =>
            Array(
              a.length + 1
            ).fill(0)
        );

      for (
        let i = 0;
        i <= b.length;
        i++
      ) {

        matrix[i][0] =
          i;

      }

      for (
        let j = 0;
        j <= a.length;
        j++
      ) {

        matrix[0][j] =
          j;

      }

      for (
        let i = 1;
        i <= b.length;
        i++
      ) {

        for (
          let j = 1;
          j <= a.length;
          j++
        ) {

          const cost =
            b[i - 1] ===
            a[j - 1]
              ? 0
              : 1;

          matrix[i][j] =
            Math.min(

              matrix[i - 1][j] +
                1,

              matrix[i][j - 1] +
                1,

              matrix[i - 1][j - 1] +
                cost

            );

        }

      }

      return matrix[
        b.length
      ][
        a.length
      ];

    }


    /* ==================================================
       TEXT TO SPEECH
       ================================================== */

    function getBestVoice(
      languageCode
    ) {

      const voices =
        window.speechSynthesis
          .getVoices();

      if (!voices.length) {
        return null;
      }

      const exact =
        voices.find(
          voice =>
            voice.lang
              .toLowerCase() ===
            languageCode
              .toLowerCase()
        );

      if (exact) {
        return exact;
      }

      const base =
        languageCode
          .split("-")[0]
          .toLowerCase();

      return voices.find(
        voice =>
          voice.lang
            .toLowerCase()
            .startsWith(base)
      ) || null;

    }


    function speakText(
      text
    ) {

      if (
        !(
          "speechSynthesis"
          in window
        )
      ) {

        showToast(
          "text-to-speech is not available in this browser."
        );

        return;

      }

      const language =
        languageData[
          currentLanguage
        ];

      if (!language) {
        return;
      }

      window.speechSynthesis
        .cancel();

      const speakNow =
        () => {

          const utterance =
            new SpeechSynthesisUtterance(
              text
            );

          utterance.lang =
            language.code;

          utterance.rate =
            0.78;

          utterance.pitch =
            1;

          const voice =
            getBestVoice(
              language.code
            );

          if (voice) {
            utterance.voice =
              voice;
          }

          window.speechSynthesis
            .speak(
              utterance
            );

        };


      if (
        window.speechSynthesis
          .getVoices()
          .length
      ) {

        speakNow();

      } else {

        window.speechSynthesis
          .onvoiceschanged =
          () => {

            speakNow();

            window.speechSynthesis
              .onvoiceschanged =
              null;

          };

      }

    }


    /* ==================================================
       NEXT QUESTION
       ================================================== */

    function showNextButton() {

      if (
        $("next-question-button")
      ) {

        return;

      }

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "next-row";

      row.innerHTML = `

        <button
          id="next-question-button"
          class="next-button"
          type="button"
        >
          ${
            currentQuestionIndex + 1 >=
            currentQuestions.length
              ? "finish lesson →"
              : "continue →"
          }
        </button>

      `;

      $("question-area")
        .appendChild(
          row
        );

      $("next-question-button")
        .addEventListener(
          "click",
          nextQuestion
        );

    }


    function nextQuestion() {

      stopSpeechRecognition();

      currentQuestionIndex++;

      renderCurrentQuestion();

    }


    /* ==================================================
       LESSON RESULTS
       ================================================== */

    async function finishLesson() {

      stopSpeechRecognition();

      const total =
        currentQuestions.length;

      const percentage =
        total === 0
          ? 0
          : Math.round(
              (
                lessonCorrect /
                total
              ) * 100
            );

      const averageSpeaking =
        speechScores.length
          ? Math.round(
              speechScores.reduce(
                (
                  sum,
                  score
                ) =>
                  sum + score,
                0
              ) /
              speechScores.length
            )
          : 0;

      const listeningAccuracy =
        listeningTotal
          ? Math.round(
              (
                listeningCorrect /
                listeningTotal
              ) * 100
            )
          : 0;

      const xp =
        calculateLessonXP(
          percentage
        );

      if (progress) {

        progress.xp =
          Number(
            progress.xp || 0
          ) + xp;

        progress.lessons_completed =
          Number(
            progress.lessons_completed || 0
          ) + 1;

        progress.words_learned =
          Number(
            progress.words_learned || 0
          ) + total;

        progress.streak =
          updateStreak(
            Number(
              progress.streak || 0
            )
          );

        await saveProgress();

      }

      const content =
        $("content");

      content.innerHTML = `

        <div class="page-kicker">
          lesson complete
        </div>

        <h1 class="page-title">
          finished.
        </h1>

        <div class="result-box">

          <div class="result-score">
            ${percentage}%
          </div>

          <div class="result-label">
            overall lesson accuracy
          </div>

        </div>

        <div class="result-stats">

          <div class="result-stat">

            <div class="result-stat-number">
              +${xp}
            </div>

            <div class="result-stat-label">
              xp earned
            </div>

          </div>

          <div class="result-stat">

            <div class="result-stat-number">
              ${listeningAccuracy}%
            </div>

            <div class="result-stat-label">
              listening accuracy
            </div>

          </div>

          <div class="result-stat">

            <div class="result-stat-number">
              ${
                speechScores.length
                  ? averageSpeaking + "%"
                  : "—"
              }
            </div>

            <div class="result-stat-label">
              speaking accuracy
            </div>

          </div>

        </div>

        <div
          style="
            display:flex;
            gap:10px;
            margin-top:35px;
            flex-wrap:wrap;
          "
        >

          <button
            class="primary-button"
            style="width:auto"
            onclick="renderLessonOptions()"
          >
            practice again
          </button>

          <button
            class="secondary-button"
            onclick="renderTopics()"
          >
            choose another topic
          </button>

        </div>

      `;

      updateTopbar();

    }


    function calculateLessonXP(
      percentage
    ) {

      let base = 20;

      if (
        percentage >= 90
      ) {

        base = 50;

      }

      else if (
        percentage >= 75
      ) {

        base = 40;

      }

      else if (
        percentage >= 60
      ) {

        base = 30;

      }

      return base;

    }


    function updateStreak(
      current
    ) {

      const key =
        "language_learn_last_lesson";

      const today =
        new Date()
          .toISOString()
          .slice(0, 10);

      const previous =
        localStorage.getItem(
          key
        );

      if (
        previous === today
      ) {

        return current;

      }

      const yesterday =
        new Date();

      yesterday.setDate(
        yesterday.getDate() - 1
      );

      const yesterdayString =
        yesterday
          .toISOString()
          .slice(0, 10);

      localStorage.setItem(
        key,
        today
      );

      if (
        previous ===
        yesterdayString
      ) {

        return current + 1;

      }

      return 1;

    }


    /* ==================================================
       PROGRESS PAGE
       ================================================== */

    async function showProgress() {

      await loadProgress();

      stopSpeechRecognition();

      setActiveNav("progress");

      const content =
        $("content");

      const xp =
        Number(
          progress?.xp || 0
        );

      const streak =
        Number(
          progress?.streak || 0
        );

      const lessons =
        Number(
          progress?.lessons_completed ||
          0
        );

      const words =
        Number(
          progress?.words_learned ||
          0
        );

      content.innerHTML = `

        <div class="page-kicker">
          your progress
        </div>

        <h1 class="page-title">
          progress.
        </h1>

        <p class="page-description">
          your account keeps your main
          learning progress saved.
        </p>

        <div class="stats-grid">

          <div class="stat-card">

            <div class="stat-number">
              ${xp}
            </div>

            <div class="stat-label">
              xp
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-number">
              ${streak}
            </div>

            <div class="stat-label">
              day streak
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-number">
              ${lessons}
            </div>

            <div class="stat-label">
              lessons
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-number">
              ${words}
            </div>

            <div class="stat-label">
              expressions
            </div>

          </div>

        </div>

        <div class="progress-section">

          <div class="section-title">
            available topics
          </div>

          <div id="progress-topics"></div>

        </div>

      `;

      renderProgressTopics();

    }


    function renderProgressTopics() {

      const area =
        $("progress-topics");

      if (!area) {
        return;
      }

      const languageKey =
        currentLanguage ||
        progress?.language;

      if (
        !languageKey ||
        !languageData[languageKey]
      ) {

        area.innerHTML = `

          <div class="muted">
            choose a language to begin.
          </div>

        `;

        return;

      }

      const topics =
        languageData[
          languageKey
        ].topics;

      area.innerHTML =
        Object.values(
          topics
        )
          .map(
            topic => `

              <div
                class="topic-progress-row"
              >

                <div>
                  ${escapeHTML(topic.name)}
                </div>

                <div
                  class="topic-progress-bar"
                >

                  <div
                    class="topic-progress-fill"
                    style="width:0%"
                  ></div>

                </div>

                <div
                  class="tiny"
                >
                  —
                </div>

              </div>

            `
          )
          .join("");

    }


    /* ==================================================
       PROFILE
       ================================================== */

    function showProfile() {

      stopSpeechRecognition();

      setActiveNav("profile");

      const content =
        $("content");

      content.innerHTML = `

        <div class="page-kicker">
          account
        </div>

        <h1 class="page-title">
          profile.
        </h1>

        <div class="profile-block">

          <div class="profile-label">
            email
          </div>

          <div class="profile-value">
            ${escapeHTML(
              currentUser?.email ||
              "unknown"
            )}
          </div>

        </div>

        <div class="profile-block">

          <div class="profile-label">
            current language
          </div>

          <div class="profile-value">
            ${
              currentLanguage
                ? escapeHTML(
                    languageData[
                      currentLanguage
                    ].name
                  )
                : "not selected"
            }
          </div>

        </div>

        <div class="profile-block">

          <div class="profile-label">
            speaking
          </div>

          <div class="profile-value muted">
            browser speech recognition
          </div>

        </div>

        <div class="profile-block">

          <div class="profile-label">
            listening
          </div>

          <div class="profile-value muted">
            browser text-to-speech
          </div>

        </div>

        <div
          class="profile-block"
          style="margin-top:20px"
        >

          <button
            class="secondary-button"
            onclick="logout()"
          >
            logout
          </button>

        </div>

      `;

    }


    /* ==================================================
       INITIALIZE
       ================================================== */

    window.addEventListener(
      "load",
      () => {

        /*
          Pre-load browser voices when possible.
          This makes the first listening question
          more reliable.
        */

        if (
          "speechSynthesis"
          in window
        ) {

          window.speechSynthesis
            .getVoices();

        }

        initializeAuth();

      }
    );


    /*
      Refresh voices when browsers load them
      asynchronously.
    */

    if (
      "speechSynthesis"
      in window
    ) {

      window.speechSynthesis
        .addEventListener(
          "voiceschanged",
          () => {
            window.speechSynthesis
              .getVoices();
          }
        );

    }

  </script>

</body>
