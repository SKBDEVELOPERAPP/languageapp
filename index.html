<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>SKB</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    color: #292725;
    font-family: "Courier New", monospace;

    background-color: #eee9dc;

    background-image:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 31px,
            rgba(100,130,140,.16) 32px
        );

    min-height: 100vh;
}


/* notebook margin */

body::before {
    content: "";
    position: fixed;
    top: 0;
    bottom: 0;
    left: 52px;
    width: 1px;
    background: rgba(170,90,90,.35);
    pointer-events: none;
}


/* app */

.app {
    width: min(100%, 500px);
    min-height: 100vh;
    margin: auto;
    padding-bottom: 100px;
}


/* header */

header {
    padding: 38px 28px 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.logo {
    font-family: Georgia, serif;
    font-size: 34px;
    font-style: italic;
    letter-spacing: -2px;
}

.subtitle {
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: #77736b;
    margin-top: 3px;
}

.streak {
    font-size: 13px;
    background: #e4d9bd;
    border: 1px dashed #817864;
    padding: 7px 10px;
    transform: rotate(2deg);
}


/* welcome */

.welcome {
    padding: 30px 28px 20px;
}

.welcome small {
    color: #827b70;
    font-size: 11px;
}

.welcome h1 {
    font-family: Georgia, serif;
    font-weight: normal;
    font-size: 34px;
    line-height: 1.05;
    margin: 8px 0 12px;
}

.welcome p {
    color: #77736b;
    font-size: 13px;
    line-height: 1.7;
}


/* language cards */

.languages {
    padding: 5px 28px;
}

.language {
    position: relative;

    width: 100%;
    min-height: 78px;

    margin-bottom: 17px;
    padding: 15px 18px;

    display: flex;
    align-items: center;
    gap: 15px;

    background: rgba(250,248,239,.82);

    border: 1px solid #77736b;
    border-radius: 3px;

    color: #292725;

    font-family: "Courier New", monospace;
    font-size: 15px;
    text-align: left;

    cursor: pointer;

    box-shadow: 3px 4px 0 rgba(80,75,65,.2);

    transition: .15s;
}

.language:nth-child(1) {
    transform: rotate(-.5deg);
}

.language:nth-child(2) {
    transform: rotate(.7deg);
}

.language:nth-child(3) {
    transform: rotate(-.4deg);
}

.language:nth-child(4) {
    transform: rotate(.6deg);
}

.language:hover {
    transform: translateY(-2px) rotate(0deg);
    background: #f8f4e8;
}

.flag {
    font-size: 28px;
}

.language-info {
    font-weight: bold;
}

.language-info small {
    display: block;
    margin-top: 5px;
    color: #898379;
    font-weight: normal;
    font-size: 11px;
}


/* little notebook marks */

.language::after {
    content: "→";
    position: absolute;
    right: 18px;
    color: #898379;
}


/* lesson */

.lesson {
    display: none;
    padding: 25px 28px;
}

.back {
    border: none;
    background: none;
    padding: 5px 0 25px;

    color: #706b62;
    font-family: "Courier New", monospace;
    font-size: 12px;

    cursor: pointer;
}

.lesson-header small {
    color: #8a8377;
    font-size: 11px;
}

.lesson-header h1 {
    font-family: Georgia, serif;
    font-weight: normal;
    font-style: italic;
    font-size: 28px;
    margin: 7px 0 20px;
}


/* flashcard */

.lesson-card {
    position: relative;

    padding: 45px 25px 35px;

    background: rgba(250,248,239,.92);

    border: 1px solid #77736b;

    box-shadow:
        5px 6px 0 rgba(80,75,65,.18);

    transform: rotate(-.4deg);

    text-align: center;
}


/* tape */

.lesson-card::before {
    content: "";
    position: absolute;

    width: 80px;
    height: 22px;

    top: -11px;
    left: 50%;

    transform: translateX(-50%) rotate(-2deg);

    background: rgba(202,185,143,.65);
}


/* word */

.word {
    font-family: Georgia, serif;
    font-size: 43px;
    margin: 25px 0 10px;
}

.translation {
    font-size: 15px;
    color: #77736b;
}

.pronunciation {
    margin-top: 8px;
    color: #999187;
    font-size: 12px;
}


/* speaker */

.speak {
    display: block;

    width: 55px;
    height: 55px;

    margin: 27px auto 17px;

    border-radius: 50%;

    border: 1px solid #555049;

    background: #e3dccb;

    font-size: 20px;

    cursor: pointer;

    box-shadow: 2px 3px 0 rgba(80,75,65,.25);
}

.speak:hover {
    background: #d8cfbb;
}


/* speaking */

.practice {
    width: 100%;

    padding: 14px;

    background: #36332f;
    color: #f7f3e9;

    border: none;
    border-radius: 2px;

    font-family: "Courier New", monospace;
    font-size: 13px;

    cursor: pointer;
}

.practice:hover {
    background: #4a4640;
}

.message {
    min-height: 25px;
    margin-top: 17px;

    color: #77736b;

    font-size: 11px;
}


/* progress */

.progress-box {
    margin-top: 28px;
    text-align: left;
}

.progress-label {
    display: flex;
    justify-content: space-between;

    color: #817b71;
    font-size: 10px;

    margin-bottom: 7px;
}

.progress {
    height: 5px;
    background: #ded8ca;
}

.progress-fill {
    width: 20%;
    height: 100%;
    background: #686158;
}


/* navigation */

nav {
    position: fixed;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: min(500px, 100%);

    display: flex;
    justify-content: space-around;

    padding: 13px 5px 17px;

    background: rgba(238,233,220,.96);

    border-top: 1px dashed #8d867a;

    z-index: 10;
}

nav button {
    border: none;
    background: none;

    color: #8a8378;

    font-family: "Courier New", monospace;
    font-size: 10px;

    cursor: pointer;

    line-height: 1.7;
}

nav button:first-child {
    color: #292725;
}


/* phone */

@media (max-width: 480px) {

    body::before {
        left: 32px;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .word {
        font-size: 36px;
    }

}

</style>
</head>


<body>

<div class="app">


<header>

    <div>
        <div class="logo">lingua</div>
        <div class="subtitle">a little language journal</div>
    </div>

    <div class="streak">
        ♡ 0 days
    </div>

</header>


<main>


<section id="home">

    <div class="welcome">

        <small>entry no. 001</small>

        <h1>what are we<br>learning today?</h1>

        <p>
            pick a language.<br>
            take your time.
        </p>

    </div>


    <div class="languages">


        <button class="language"
                onclick="openLanguage('Korean')">

            <span class="flag">🇰🇷</span>

            <div class="language-info">
                korean
                <small>한국어 · hanguk-eo</small>
            </div>

        </button>


        <button class="language"
                onclick="openLanguage('Japanese')">

            <span class="flag">🇯🇵</span>

            <div class="language-info">
                japanese
                <small>日本語 · nihongo</small>
            </div>

        </button>


        <button class="language"
                onclick="openLanguage('Spanish')">

            <span class="flag">🇪🇸</span>

            <div class="language-info">
                spanish
                <small>español · español</small>
            </div>

        </button>


        <button class="language"
                onclick="openLanguage('French')">

            <span class="flag">🇫🇷</span>

            <div class="language-info">
                french
                <small>français · français</small>
            </div>

        </button>


    </div>

</section>



<section id="lesson" class="lesson">


    <button class="back"
            onclick="goHome()">

        ← back to languages

    </button>


    <div class="lesson-header">

        <small id="languageName"></small>

        <h1>lesson 01 · greetings</h1>

    </div>


    <div class="lesson-card">


        <div
            class="word"
            id="word">
        </div>


        <div
            class="translation"
            id="translation">
        </div>


        <div
            class="pronunciation"
            id="pronunciation">
        </div>


        <button
            class="speak"
            onclick="speakWord()">

            ♫

        </button>


        <button
            class="practice"
            onclick="startSpeaking()">

            say it out loud →

        </button>


        <div
            class="message"
            id="message">
        </div>


        <div class="progress-box">

            <div class="progress-label">

                <span>lesson progress</span>

                <span>01 / 05</span>

            </div>

            <div class="progress">

                <div class="progress-fill"></div>

            </div>

        </div>


    </div>


</section>


</main>


<nav>

    <button onclick="goHome()">
        ♡<br>
        home
    </button>

    <button>
        ✎<br>
        lessons
    </button>

    <button>
        ∿<br>
        progress
    </button>

    <button>
        ○<br>
        profile
    </button>

</nav>


</div>


<script>


const lessons = {

    Korean: {
        word: "안녕하세요",
        translation: "hello",
        pronunciation: "annyeonghaseyo",
        language: "ko-KR"
    },

    Japanese: {
        word: "こんにちは",
        translation: "hello",
        pronunciation: "konnichiwa",
        language: "ja-JP"
    },

    Spanish: {
        word: "hola",
        translation: "hello",
        pronunciation: "oh-la",
        language: "es-ES"
    },

    French: {
        word: "bonjour",
        translation: "hello",
        pronunciation: "bon-zhoor",
        language: "fr-FR"
    }

};


let currentLanguage = null;


function openLanguage(language) {

    currentLanguage = language;

    const lesson = lessons[language];

    document.getElementById("home").style.display = "none";

    document.getElementById("lesson").style.display = "block";

    document.getElementById("languageName").innerText =
        language.toLowerCase();

    document.getElementById("word").innerText =
        lesson.word;

    document.getElementById("translation").innerText =
        lesson.translation;

    document.getElementById("pronunciation").innerText =
        "/" + lesson.pronunciation + "/";

    document.getElementById("message").innerText = "";

}


function goHome() {

    document.getElementById("lesson").style.display = "none";

    document.getElementById("home").style.display = "block";

}


function speakWord() {

    const lesson = lessons[currentLanguage];

    const speech =
        new SpeechSynthesisUtterance(lesson.word);

    speech.lang = lesson.language;

    speech.rate = 0.8;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);

}


function startSpeaking() {

    const message =
        document.getElementById("message");

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        message.innerText =
            "speaking practice isn't supported here yet.";

        return;

    }


    const recognition =
        new SpeechRecognition();

    recognition.lang =
        lessons[currentLanguage].language;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    message.innerText =
        "listening...";


    recognition.start();


    recognition.onresult = function(event) {

        const spoken =
            event.results[0][0].transcript;

        message.innerText =
            "you said: " + spoken + " ✓";

    };


    recognition.onerror = function() {

        message.innerText =
            "couldn't hear you. try again.";

    };

}


</script>

</body>
</html>
