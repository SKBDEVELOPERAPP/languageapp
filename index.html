<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4eddf" />
  <title>SKB — language journal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
   * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #191919;
  color: #e4e0d8;
  font-family: "Courier New", Courier, monospace;
  font-size: 14px;
  letter-spacing: 0.2px;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   app
========================= */

.app {
  width: min(100%, 720px);
  margin: auto;
  padding: 55px 35px 100px;
}

/* =========================
   login
========================= */

.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background: #191919;
}

.auth-card {
  width: min(100%, 390px);
  background: #1d1d1d;
  border: 1px solid #3a3a3a;
  padding: 42px;
}

.auth-logo {
  font-family: "Courier New", Courier, monospace;
  font-size: 30px;
  font-weight: normal;
  letter-spacing: -1px;
  margin-bottom: 8px;
}

.auth-subtitle {
  color: #777;
  font-size: 12px;
  margin-bottom: 40px;
}

.auth-card label {
  display: block;
  color: #888;
  font-size: 11px;
  text-transform: lowercase;
  margin: 20px 0 8px;
}

.auth-card input {
  width: 100%;
  padding: 11px 0;
  border: none;
  border-bottom: 1px solid #444;
  outline: none;
  background: transparent;
  color: #eee;
}

.auth-card input:focus {
  border-bottom-color: #aaa;
}

.auth-button {
  width: 100%;
  margin-top: 30px;
  padding: 12px;
  border: 1px solid #777;
  background: #e4e0d8;
  color: #191919;
}

.auth-button:hover {
  background: #fff;
}

.auth-switch {
  text-align: center;
  margin-top: 22px;
  color: #666;
  font-size: 11px;
}

.auth-switch button {
  border: none;
  background: none;
  color: #aaa;
  text-decoration: underline;
  padding: 0;
}

.auth-message {
  margin-top: 18px;
  color: #999;
  font-size: 11px;
  line-height: 1.5;
}

/* =========================
   header
========================= */

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 90px;
}

.logo {
  font-family: "Courier New", Courier, monospace;
  font-size: 27px;
  font-weight: normal;
  letter-spacing: -1px;
}

.subtitle {
  margin-top: 7px;
  color: #666;
  font-size: 10px;
}

.streak {
  color: #777;
  font-size: 11px;
}

/* =========================
   titles
========================= */

.entry {
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

.page-title {
  font-size: 23px;
  font-weight: normal;
  margin-bottom: 9px;
}

.page-subtitle {
  color: #777;
  font-size: 12px;
  margin-bottom: 38px;
}

/* =========================
   languages
========================= */

.languages {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  border: 1px solid #353535;
  background: #353535;
}

.language-card {
  text-align: left;
  min-height: 145px;
  padding: 24px;
  border: none;
  background: #1c1c1c;
  color: #ddd;
  transition: background 0.15s ease;
}

.language-card:hover {
  background: #242424;
}

.flag {
  display: none;
}

.language-name {
  font-size: 16px;
  margin-bottom: 8px;
}

.language-native {
  color: #666;
  font-size: 11px;
}

/* =========================
   lesson
========================= */

.back-button {
  border: none;
  background: none;
  color: #666;
  padding: 0;
  margin-bottom: 35px;
  font-size: 11px;
}

.back-button:hover {
  color: #aaa;
}

.lesson-card {
  border-top: 1px solid #3b3b3b;
  padding-top: 35px;
  background: transparent;
  box-shadow: none;
}

.lesson-language {
  color: #666;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 35px;
}

.word {
  font-size: 42px;
  font-weight: normal;
  margin-bottom: 12px;
  color: #eee;
}

.translation {
  color: #aaa;
  font-size: 15px;
}

.pronunciation {
  color: #666;
  font-size: 11px;
  margin-top: 9px;
}

.speaker {
  margin-top: 30px;
  width: 40px;
  height: 40px;
  border: 1px solid #555;
  border-radius: 0;
  background: transparent;
  color: #bbb;
}

.speaker:hover {
  background: #292929;
}

.practice {
  display: block;
  width: 100%;
  margin-top: 30px;
  padding: 14px;
  border: 1px solid #555;
  background: transparent;
  color: #ccc;
  text-align: left;
}

.practice:hover {
  background: #242424;
}

.progress-area {
  margin-top: 45px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  color: #666;
  font-size: 10px;
  margin-bottom: 10px;
}

.progress-track {
  height: 2px;
  background: #333;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #aaa;
}

.lesson-complete {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border: 1px solid #444;
  background: transparent;
  color: #888;
}

.lesson-complete:hover {
  color: #ddd;
  border-color: #777;
}

/* =========================
   progress
========================= */

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: #353535;
  border: 1px solid #353535;
}

.stat {
  padding: 28px;
  background: #1c1c1c;
}

.stat-number {
  font-size: 28px;
  color: #ddd;
}

.stat-label {
  margin-top: 8px;
  color: #666;
  font-size: 10px;
}

/* =========================
   profile
========================= */

.profile-card {
  border-top: 1px solid #3b3b3b;
  padding-top: 25px;
}

.email-display {
  color: #999;
  font-size: 12px;
  margin-bottom: 30px;
}

.logout {
  border: 1px solid #444;
  background: transparent;
  color: #888;
  padding: 10px 18px;
}

.logout:hover {
  color: #ddd;
  border-color: #777;
}

/* =========================
   navigation
========================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 720px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #191919;
  border-top: 1px solid #333;
  padding: 5px 0;
}

.nav-button {
  border: none;
  background: transparent;
  color: #555;
  padding: 12px;
  font-size: 10px;
}

.nav-button:hover {
  color: #aaa;
}

.nav-button.active {
  color: #ddd;
}

/* =========================
   mobile
========================= */

@media (max-width: 550px) {

  .app {
    padding: 35px 20px 90px;
  }

  header {
    margin-bottom: 65px;
  }

  .languages {
    grid-template-columns: 1fr;
  }

  .language-card {
    min-height: 95px;
  }

  .word {
    font-size: 34px;
  }

  .auth-card {
    padding: 30px;
  }
}
<script>
  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://gdcvudbqwkdiccyugtxz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_K7S7aII4qnXr4N04kQphMw_ZlPKsxBQ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     LANGUAGE DATA
  ========================================================= */

  const lessons = {

    korean: [
      {
        word: "안녕하세요",
        translation: "hello",
        pronunciation: "annyeonghaseyo"
      },
      {
        word: "감사합니다",
        translation: "thank you",
        pronunciation: "gamsahamnida"
      },
      {
        word: "네",
        translation: "yes",
        pronunciation: "ne"
      },
      {
        word: "아니요",
        translation: "no",
        pronunciation: "aniyo"
      },
      {
        word: "친구",
        translation: "friend",
        pronunciation: "chingu"
      }
    ],

    japanese: [
      {
        word: "こんにちは",
        translation: "hello",
        pronunciation: "konnichiwa"
      },
      {
        word: "ありがとう",
        translation: "thank you",
        pronunciation: "arigatou"
      },
      {
        word: "はい",
        translation: "yes",
        pronunciation: "hai"
      },
      {
        word: "いいえ",
        translation: "no",
        pronunciation: "iie"
      },
      {
        word: "友達",
        translation: "friend",
        pronunciation: "tomodachi"
      }
    ],

    spanish: [
      {
        word: "hola",
        translation: "hello",
        pronunciation: "oh-la"
      },
      {
        word: "gracias",
        translation: "thank you",
        pronunciation: "grah-see-ahs"
      },
      {
        word: "sí",
        translation: "yes",
        pronunciation: "see"
      },
      {
        word: "no",
        translation: "no",
        pronunciation: "noh"
      },
      {
        word: "amigo",
        translation: "friend",
        pronunciation: "ah-mee-goh"
      }
    ],

    french: [
      {
        word: "bonjour",
        translation: "hello",
        pronunciation: "bohn-zhoor"
      },
      {
        word: "merci",
        translation: "thank you",
        pronunciation: "mehr-see"
      },
      {
        word: "oui",
        translation: "yes",
        pronunciation: "wee"
      },
      {
        word: "non",
        translation: "no",
        pronunciation: "noh"
      },
      {
        word: "ami",
        translation: "friend",
        pronunciation: "ah-mee"
      }
    ]

  };


  const languageCodes = {
    korean: "ko-KR",
    japanese: "ja-JP",
    spanish: "es-ES",
    french: "fr-FR"
  };


  let currentUser = null;
  let currentLanguage = null;
  let currentWordIndex = 0;
  let progressData = null;


  /* =========================================================
     AUTH
  ========================================================= */

  function showSignup() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("authMessage").textContent = "";
  }


  function showLogin() {
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("authMessage").textContent = "";
  }


  async function signup() {

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const message =
      document.getElementById("authMessage");

    if (!email || !password) {
      message.textContent = "please enter an email and password.";
      return;
    }

    if (password.length < 6) {
      message.textContent =
        "your password needs at least 6 characters.";
      return;
    }

    message.textContent = "creating your journal...";

    const { data, error } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    if (data.session) {
      currentUser = data.user;
      await setupUser();
    } else {
      message.textContent =
        "check your email to confirm your account.";
    }
  }


  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("authMessage");

    if (!email || !password) {
      message.textContent =
        "please enter your email and password.";
      return;
    }

    message.textContent = "opening your journal...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    currentUser = data.user;

    await setupUser();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    progressData = null;

    document.getElementById("app").classList.add("hidden");
    document.getElementById("authScreen").classList.remove("hidden");

    showLogin();
  }


  /* =========================================================
     USER / PROGRESS
  ========================================================= */

  async function setupUser() {

    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("profileEmail").textContent =
      currentUser.email;

    await loadProgress();

    showPage("home");
  }


  async function loadProgress() {

    const { data, error } =
      await supabaseClient
        .from("user_progress")
        .select("*")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (error) {
      console.error(error);
      return;
    }

    if (!data) {

      const { data: newProgress, error: insertError } =
        await supabaseClient
          .from("user_progress")
          .insert({
            user_id: currentUser.id,
            language: "none",
            xp: 0,
            streak: 0,
            lessons_completed: 0,
            words_learned: 0
          })
          .select()
          .single();

      if (insertError) {
        console.error(insertError);
        return;
      }

      progressData = newProgress;

    } else {

      progressData = data;

    }

    updateProgressUI();
  }


  async function saveProgress(changes = {}) {

    if (!currentUser || !progressData) {
      return;
    }

    const updated = {
      ...progressData,
      ...changes
    };

    const { data, error } =
      await supabaseClient
        .from("user_progress")
        .update({
          language: updated.language,
          xp: updated.xp,
          streak: updated.streak,
          lessons_completed: updated.lessons_completed,
          words_learned: updated.words_learned,
          updated_at: new Date().toISOString()
        })
        .eq("user_id", currentUser.id)
        .select()
        .single();

    if (error) {
      console.error(error);
      return;
    }

    progressData = data;

    updateProgressUI();
  }


  function updateProgressUI() {

    if (!progressData) return;

    document.getElementById("xpDisplay").textContent =
      progressData.xp || 0;

    document.getElementById("lessonsDisplay").textContent =
      progressData.lessons_completed || 0;

    document.getElementById("wordsDisplay").textContent =
      progressData.words_learned || 0;

    document.getElementById("streakDisplay").textContent =
      progressData.streak || 0;

    document.getElementById("streakStatDisplay").textContent =
      progressData.streak || 0;
  }


  /* =========================================================
     LESSONS
  ========================================================= */

  function startLesson(language) {

    currentLanguage = language;
    currentWordIndex = 0;

    const word =
      lessons[language][currentWordIndex];

    document.getElementById("lessonLanguage").textContent =
      language;

    document.getElementById("lessonWord").textContent =
      word.word;

    document.getElementById("lessonTranslation").textContent =
      word.translation;

    document.getElementById("lessonPronunciation").textContent =
      word.pronunciation;

    updateLessonProgress();

    showPage("lesson");
  }


  function updateLessonProgress() {

    const total =
      lessons[currentLanguage].length;

    const current =
      currentWordIndex + 1;

    document.getElementById("lessonProgressText").textContent =
      current + " / " + total;

    document.getElementById("lessonProgressFill").style.width =
      ((current / total) * 100) + "%";
  }


  function nextWord() {

    if (!currentLanguage) return;

    if (
      currentWordIndex <
      lessons[currentLanguage].length - 1
    ) {
      currentWordIndex++;

      const word =
        lessons[currentLanguage][currentWordIndex];

      document.getElementById("lessonWord").textContent =
        word.word;

      document.getElementById("lessonTranslation").textContent =
        word.translation;

      document.getElementById("lessonPronunciation").textContent =
        word.pronunciation;

      document.getElementById("speechResult").textContent = "";

      updateLessonProgress();

    } else {

      completeLesson();
    }
  }


  async function completeLesson() {

    if (!currentUser || !progressData) {
      return;
    }

    const newXP =
      (progressData.xp || 0) + 50;

    const newLessons =
      (progressData.lessons_completed || 0) + 1;

    const newWords =
      (progressData.words_learned || 0) +
      lessons[currentLanguage].length;

    await saveProgress({
      language: currentLanguage,
      xp: newXP,
      lessons_completed: newLessons,
      words_learned: newWords
    });

    alert("lesson saved ♡ +50 xp");

    showPage("progress");
  }


  /* =========================================================
     SPEECH
  ========================================================= */

  function speakCurrentWord() {

    if (!currentLanguage) return;

    const word =
      lessons[currentLanguage][currentWordIndex];

    const speech =
      new SpeechSynthesisUtterance(word.word);

    speech.lang =
      languageCodes[currentLanguage];

    speech.rate = 0.85;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
  }


  function practiceSpeaking() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    const result =
      document.getElementById("speechResult");

    if (!SpeechRecognition) {

      result.textContent =
        "speech practice isn't supported in this browser.";

      return;
    }

    const recognition =
      new SpeechRecognition();

    recognition.lang =
      languageCodes[currentLanguage];

    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    result.textContent =
      "listening...";

    recognition.start();

    recognition.onresult = function(event) {

      const spoken =
        event.results[0][0].transcript;

      result.textContent =
        "you said: " + spoken + " ✓";
    };

    recognition.onerror = function() {

      result.textContent =
        "i couldn't hear that. try again.";
    };
  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  function showPage(page) {

    document
      .getElementById("homePage")
      .classList.add("hidden");

    document
      .getElementById("lessonPage")
      .classList.add("hidden");

    document
      .getElementById("progressPage")
      .classList.add("hidden");

    document
      .getElementById("profilePage")
      .classList.add("hidden");


    if (page === "home") {
      document
        .getElementById("homePage")
        .classList.remove("hidden");
    }

    if (page === "lesson") {
      document
        .getElementById("lessonPage")
        .classList.remove("hidden");
    }

    if (page === "progress") {
      document
        .getElementById("progressPage")
        .classList.remove("hidden");

      updateProgressUI();
    }

    if (page === "profile") {
      document
        .getElementById("profilePage")
        .classList.remove("hidden");
    }


    document
      .querySelectorAll(".nav-button")
      .forEach(button => button.classList.remove("active"));

    const buttons =
      document.querySelectorAll(".nav-button");

    if (page === "home") buttons[0].classList.add("active");
    if (page === "lesson") buttons[1].classList.add("active");
    if (page === "progress") buttons[2].classList.add("active");
    if (page === "profile") buttons[3].classList.add("active");
  }


  function goHome() {
    showPage("home");
  }


  /* =========================================================
     CHECK LOGIN WHEN PAGE LOADS
  ========================================================= */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      currentUser = data.session.user;

      await setupUser();

    } else {

      document
        .getElementById("authScreen")
        .classList.remove("hidden");

      document
        .getElementById("app")
        .classList.add("hidden");
    }
  }


  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (session && !currentUser) {

        currentUser = session.user;

        await setupUser();
      }

    }
  );


  checkSession();

</script>

</body>
</html>
